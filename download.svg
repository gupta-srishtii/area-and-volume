<svg font-family="-apple-system-body, ui-sans-serif, -apple-system, system-ui, &quot;Segoe UI&quot;, Helvetica, &quot;Apple Color Emoji&quot;, Arial, sans-serif, &quot;Segoe UI Emoji&quot;, &quot;Segoe UI Symbol&quot;" font-weight="400" data-d-component="svg" fill="currentColor" style="color:rgb(237, 237, 237)" viewBox="0 0 350 780" width="100%" xmlns="http://www.w3.org/2000/svg"><defs><marker id="arr" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#64748b" stroke-width="1.2"/></marker></defs><rect x="130" y="12" width="90" height="36" rx="18" fill="#dbeafe" stroke="#5886bc"/><text x="175" y="34" text-anchor="middle" font-size="12" fill="#172d4b" font-weight="600">START</text><rect x="67.5" y="65" width="215" height="36" rx="7" fill="#eaf1fc" stroke="#5886bc"/><text x="175" y="87" text-anchor="middle" font-size="12" fill="#172d4b" font-weight="600">Open Numerical Calculator</text><rect x="82.5" y="126" width="185" height="36" rx="7" fill="#eaf1fc" stroke="#5886bc"/><text x="175" y="148" text-anchor="middle" font-size="12" fill="#172d4b" font-weight="600">Select Input Mode</text><g stroke="#64748b" stroke-width="1.4" fill="none" marker-end="url(#arr)"><path d="M175 48 V65"/><path d="M175 101 V126"/><path d="M175 162 V176 H85 V199"/><path d="M175 176 H265 V199"/></g><text x="80" y="191" text-anchor="middle" font-size="10" fill="currentColor">Function / Shape</text><text x="271" y="191" text-anchor="middle" font-size="10" fill="currentColor">Given Values</text><rect x="8" y="199" width="154" height="88" rx="8" fill="#eaf1fc" stroke="#5886bc"/><text x="85" y="217" text-anchor="middle" font-size="11" font-weight="600" fill="#172d4b">Select Area / Volume</text><text x="85" y="237" text-anchor="middle" font-size="10" fill="#172d4b">Choose function</text><text x="85" y="252" text-anchor="middle" font-size="10" fill="#172d4b">Enter limits a, b</text><text x="85" y="267" text-anchor="middle" font-size="10" fill="#
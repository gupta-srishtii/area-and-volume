/><text x="313" y="429" text-anchor="middle" font-size="9" fill="#842b2b">Show</text><text x="313" y="440" text-anchor="middle" font-size="9" fill="#842b2b">Error</text><path d="M281 432 H267 V344 H272" stroke="#b45309" stroke-width="1.2" stroke-dasharray="4 3" fill="none"/><path d="M175 524 V543" stroke="#64748b" stroke-width="1.4" marker-end="url(#arr)"/><text x="190" y="536" font-size="10" fill="currentColor">Yes</text><rect x="65" y="543" width="220" height="44" rx="8" fill="#dbeafe" stroke="#5886bc"/><text x="175" y="560" text-anchor="middle" font-size="11" font-weight="600" fill="#172d4b">Calculate Numerical Integral</text><text x="175" y="575" text-anchor="middle" font-size="10" fill="#172d4b">Apply selected rule / formula</text><path d="M175 587 V605" stroke="#64748b" stroke-width="1.4" marker-end="url(#arr)"/><rect x="53" y="605" width="244" height="75" rx="8" fill="#dcfce7" stroke="#5eab7a"/><text x="175" y="622" text-anchor="middle" font-size="12" font-weight="600" fill="#14532d">Display Results</text><text x="175" y="639" text-anchor="middle" font-size="10" fill="#14532d">Area / Volume approximation</text><text x="175" y="654" text-anchor="middle" font-size="10" fill="#14532d">Graph + method comparison</text><text x="175" y="669" text-anchor="middle" font-size="10" fill="#14532d">Exact error (if known) + steps</text><path d="M175 680 V704" stroke="#64748b" stroke-width="1.4" marker-end="url(#arr)"/><rect x="130" y="704" width="90" height="37" rx="19" fill="#dbeafe" stroke="#5886bc"/><text x="175" y="727" text-anchor="middle" font-size="12" font-weight="600" fill="#172d4b">END</text></svg>